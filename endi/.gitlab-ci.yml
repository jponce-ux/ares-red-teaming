stages:
  - lint
  - typecheck
  - test

default:
  image: python:3.11.9
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e .[dev]
    - python -m pip install "ruff==0.4.10" "mypy==1.10.0" "pytest==8.2.2"

lint:
  stage: lint
  script:
    - ruff check src tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

typecheck:
  stage: typecheck
  needs: ["lint"]
  script:
    - mypy src
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

test:
  stage: test
  needs: ["typecheck"]
  script:
    - pytest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
